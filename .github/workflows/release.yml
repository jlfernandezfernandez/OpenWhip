name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
          - os: macos-15-intel
            command: npm run dist:mac
          - os: windows-latest
            command: npm run dist:win
          - os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Self-signed certificate: keeps the macOS Accessibility grant stable across updates.
      - if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > sign.p12
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security import sign.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '" ')
          security find-certificate -c OpenWhip -p build.keychain > cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          rm sign.p12 cert.pem
          echo "MAC_SIGN_IDENTITY=OpenWhip" >> "$GITHUB_ENV"
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v5
        with:
          name: openwhip-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist.noindex/*.dmg
            dist.noindex/*.zip
            dist.noindex/*.exe
            dist.noindex/*.AppImage
            dist.noindex/*.deb
            dist.noindex/*.exe.blockmap
            dist.noindex/latest.yml
            dist.noindex/latest-linux.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
