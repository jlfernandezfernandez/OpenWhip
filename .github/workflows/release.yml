name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
          - os: macos-15-intel
            command: npm run dist:mac
          - os: windows-latest
            command: npm run dist:win
          - os: ubuntu-latest
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v5
        with:
          name: openwhip-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist.noindex/*.dmg
            dist.noindex/*.zip
            dist.noindex/*.exe
            dist.noindex/*.AppImage
            dist.noindex/*.deb
            dist.noindex/*.exe.blockmap
            dist.noindex/latest.yml
            dist.noindex/latest-linux.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
