name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The site reuses the app's real whip renderer and sounds.
      - run: |
          mkdir -p _site/sounds
          cp site/* _site/
          cp src/overlay.js _site/overlay.js
          cp sounds/*.mp3 _site/sounds/
          cp icon/icon.png _site/icon.png
          cp assets/hero.jpg _site/hero.jpg
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
